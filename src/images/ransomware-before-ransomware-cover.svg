<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A quiet intrusion, growing denser toward encryption</title>
  <desc id="desc">A terminal-style illustration of an intrusion progressing left to right: a single quiet identity and remote-session node, through discovery and privileged systems, into an increasingly dense web of lateral connections, ending in a tight cluster of encrypted endpoints marked in warning colour.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="240" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">intrusion.timeline</text>

  <!-- quiet stage, left: identity -> remote session -->
  <g stroke="#3a3a3a" stroke-width="1.2">
    <line x1="120" y1="330" x2="230" y2="330" />
    <line x1="230" y1="330" x2="340" y2="300" />
    <line x1="230" y1="330" x2="340" y2="360" />
  </g>
  <circle cx="120" cy="330" r="10" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.5" />
  <text x="120" y="360" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#666666">identity</text>
  <circle cx="230" cy="330" r="12" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.5" />
  <text x="230" y="365" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#666666">session</text>

  <!-- discovery / privileged systems, mid-left -->
  <g stroke="#4a4a4a" stroke-width="1.3">
    <line x1="340" y1="300" x2="450" y2="270" />
    <line x1="340" y1="360" x2="450" y2="380" />
    <line x1="340" y1="300" x2="450" y2="380" />
    <line x1="450" y1="270" x2="560" y2="250" />
    <line x1="450" y1="380" x2="560" y2="400" />
  </g>
  <circle cx="340" cy="300" r="13" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <circle cx="340" cy="360" r="13" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <circle cx="450" cy="270" r="14" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <circle cx="450" cy="380" r="14" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />

  <!-- lateral movement, denser, mid-right -->
  <g stroke="#565656" stroke-width="1.4">
    <line x1="560" y1="250" x2="660" y2="220" />
    <line x1="560" y1="250" x2="660" y2="300" />
    <line x1="560" y1="400" x2="660" y2="360" />
    <line x1="560" y1="400" x2="660" y2="440" />
    <line x1="660" y1="220" x2="770" y2="240" />
    <line x1="660" y1="300" x2="770" y2="280" />
    <line x1="660" y1="300" x2="770" y2="350" />
    <line x1="660" y1="360" x2="770" y2="350" />
    <line x1="660" y1="360" x2="770" y2="410" />
    <line x1="660" y1="440" x2="770" y2="410" />
    <line x1="770" y1="240" x2="770" y2="280" />
    <line x1="770" y1="350" x2="770" y2="410" />
  </g>
  <circle cx="560" cy="250" r="14" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <circle cx="560" cy="400" r="14" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <circle cx="660" cy="220" r="13" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="660" cy="300" r="13" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="660" cy="360" r="13" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="660" cy="440" r="13" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="770" cy="240" r="12" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="770" cy="280" r="12" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="770" cy="350" r="12" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <circle cx="770" cy="410" r="12" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />

  <!-- encrypted cluster, right, dense and warm -->
  <g stroke="#6a4a4a" stroke-width="1.6" opacity="0.9">
    <line x1="770" y1="240" x2="900" y2="230" />
    <line x1="770" y1="280" x2="900" y2="270" />
    <line x1="770" y1="350" x2="900" y2="340" />
    <line x1="770" y1="410" x2="900" y2="400" />
    <line x1="900" y1="230" x2="960" y2="270" />
    <line x1="900" y1="270" x2="960" y2="270" />
    <line x1="900" y1="270" x2="960" y2="320" />
    <line x1="900" y1="340" x2="960" y2="320" />
    <line x1="900" y1="340" x2="960" y2="370" />
    <line x1="900" y1="400" x2="960" y2="370" />
    <line x1="960" y1="270" x2="1030" y2="300" />
    <line x1="960" y1="320" x2="1030" y2="300" />
    <line x1="960" y1="320" x2="1030" y2="350" />
    <line x1="960" y1="370" x2="1030" y2="350" />
  </g>
  <g fill="#2a1f1f">
    <circle cx="900" cy="230" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="900" cy="270" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="900" cy="340" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="900" cy="400" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="960" cy="270" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="960" cy="320" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="960" cy="370" r="11" stroke="#c07a7a" stroke-width="2" />
    <circle cx="1030" cy="300" r="15" stroke="#c07a7a" stroke-width="2.5" />
    <circle cx="1030" cy="350" r="15" stroke="#c07a7a" stroke-width="2.5" />
  </g>

  <!-- eyebrow -->
  <text x="600" y="540" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">THE QUIET PART COMES FIRST</text>
</svg>
