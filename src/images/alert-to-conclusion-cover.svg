<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">From alert to conclusion, by way of competing hypotheses</title>
  <desc id="desc">A terminal-style illustration of an investigation pipeline: an ALERT box flows into an EVIDENCE box, which branches into two competing HYPOTHESIS boxes, converging on a single CONCLUSION box.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="240" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">investigation.log</text>

  <!-- connecting lines, drawn first -->
  <g stroke="#444444" stroke-width="1.5" opacity="0.85">
    <line x1="600" y1="146" x2="600" y2="180" />
    <line x1="600" y1="236" x2="600" y2="260" />
    <line x1="600" y1="260" x2="390" y2="300" />
    <line x1="600" y1="260" x2="810" y2="300" />
    <line x1="390" y1="356" x2="600" y2="410" />
    <line x1="810" y1="356" x2="600" y2="410" />
    <line x1="600" y1="410" x2="600" y2="450" />
  </g>

  <!-- ALERT -->
  <rect x="500" y="100" width="200" height="46" rx="8" fill="#262626" stroke="#c07a7a" stroke-width="2" />
  <text x="600" y="129" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#c07a7a">ALERT</text>

  <!-- EVIDENCE -->
  <rect x="480" y="190" width="240" height="46" rx="8" fill="#262626" stroke="#b4a26a" stroke-width="2" />
  <text x="600" y="219" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#b4a26a">EVIDENCE</text>

  <!-- HYPOTHESIS A -->
  <rect x="270" y="310" width="240" height="46" rx="8" fill="#262626" stroke="#666666" stroke-width="2" stroke-dasharray="4 5" />
  <text x="390" y="339" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1" fill="#8f8f8f">HYPOTHESIS A</text>

  <!-- HYPOTHESIS B -->
  <rect x="690" y="310" width="240" height="46" rx="8" fill="#262626" stroke="#666666" stroke-width="2" stroke-dasharray="4 5" />
  <text x="810" y="339" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1" fill="#8f8f8f">HYPOTHESIS B</text>

  <!-- CONCLUSION -->
  <rect x="470" y="450" width="260" height="54" rx="9" fill="#2c3a37" stroke="#7fada0" stroke-width="2.5" />
  <text x="600" y="484" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#7fada0">CONCLUSION</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">DETECTION IS NOT DIAGNOSIS</text>
</svg>
