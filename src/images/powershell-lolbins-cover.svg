<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A signed process, examined in context</title>
  <desc id="desc">A terminal-style illustration of a process tree centred on PowerShell, with a parent process above, branching below into a network connection and a scheduled task, and a small signed badge on the PowerShell node.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="240" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">process-tree.log</text>

  <!-- connecting lines -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="600" y1="175" x2="600" y2="255" />
    <line x1="600" y1="315" x2="430" y2="430" />
    <line x1="600" y1="315" x2="770" y2="430" />
  </g>

  <!-- parent node -->
  <circle cx="600" cy="150" r="30" fill="#1c1c1c" stroke="#8f8f8f" stroke-width="2" />
  <text x="600" y="155" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#8f8f8f">winword.exe</text>

  <!-- powershell node, larger, with signed badge -->
  <circle cx="600" cy="315" r="46" fill="#262626" stroke="#7fada0" stroke-width="2.5" />
  <text x="600" y="310" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#7fada0">powershell</text>
  <text x="600" y="328" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">.exe</text>
  <g transform="translate(636,283)">
    <circle r="13" fill="#1c1c1c" stroke="#b4a26a" stroke-width="2" />
    <path d="M -5 0 L -1.5 4 L 5.5 -5" fill="none" stroke="#b4a26a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- network node -->
  <circle cx="430" cy="460" r="30" fill="#1c1c1c" stroke="#c07a7a" stroke-width="2" stroke-dasharray="2.5 3" />
  <text x="430" y="465" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#c07a7a">network</text>

  <!-- scheduled task node -->
  <circle cx="770" cy="460" r="30" fill="#1c1c1c" stroke="#c07a7a" stroke-width="2" stroke-dasharray="2.5 3" />
  <text x="770" y="458" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#c07a7a">scheduled</text>
  <text x="770" y="470" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#c07a7a">task</text>

  <!-- eyebrow -->
  <text x="600" y="555" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">THE TOOL IS NOT THE VERDICT</text>
</svg>
