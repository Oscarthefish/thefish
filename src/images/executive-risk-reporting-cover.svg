<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A pyramid rising from technical facts to a decision</title>
  <desc id="desc">A terminal-style illustration of a pyramid of stacked nodes, technical facts at the base, rising through security scenario, business impact, residual risk and options, to a decision at the top.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">report.log</text>

  <!-- vertical connector -->
  <line x1="600" y1="150" x2="600" y2="460" stroke="#444444" stroke-width="1.5" />

  <!-- decision, top -->
  <circle cx="600" cy="150" r="28" fill="#262626" stroke="#b4a26a" stroke-width="2.4" />
  <text x="600" y="154" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7.5" fill="#b4a26a">decision</text>

  <!-- options -->
  <circle cx="600" cy="228" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.7" />
  <text x="600" y="232" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">options</text>

  <!-- residual risk -->
  <circle cx="600" cy="292" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="600" y="290" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">residual</text>
  <text x="600" y="298" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">risk</text>

  <!-- business impact -->
  <circle cx="600" cy="356" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="600" y="354" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">business</text>
  <text x="600" y="362" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">impact</text>

  <!-- scenario -->
  <circle cx="600" cy="404" r="16" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.5" />
  <text x="600" y="408" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">scenario</text>

  <!-- technical facts, base -->
  <circle cx="600" cy="450" r="20" fill="#1c1c1c" stroke="#c07a7a" stroke-width="1.8" />
  <text x="600" y="448" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">technical</text>
  <text x="600" y="456" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6" fill="#8f8f8f">facts</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">LEAD WITH THE DECISION</text>
</svg>
