<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">One identity, two sessions</title>
  <desc id="desc">A terminal-style illustration of a user identity node connected to a device, an MFA prompt and a session token feeding an expected cloud service, with a second unfamiliar session branching off the same token toward another node.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">identity.log</text>

  <!-- connecting lines -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="180" y1="315" x2="330" y2="230" />
    <line x1="180" y1="315" x2="330" y2="315" />
    <line x1="180" y1="315" x2="330" y2="400" />
    <line x1="330" y1="230" x2="480" y2="315" />
    <line x1="330" y1="315" x2="480" y2="315" />
    <line x1="330" y1="400" x2="480" y2="315" />
    <line x1="480" y1="315" x2="660" y2="230" />
  </g>
  <g stroke="#c07a7a" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="480" y1="315" x2="660" y2="420" />
  </g>

  <!-- identity node -->
  <circle cx="180" cy="315" r="34" fill="#262626" stroke="#7fada0" stroke-width="2.5" />
  <text x="180" y="320" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7fada0">identity</text>

  <!-- device -->
  <circle cx="330" cy="230" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="330" y="266" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8f8f8f">device</text>

  <!-- MFA -->
  <circle cx="330" cy="315" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="330" y="351" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8f8f8f">MFA</text>

  <!-- password -->
  <circle cx="330" cy="400" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="330" y="436" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">password</text>

  <!-- session token, central -->
  <circle cx="480" cy="315" r="30" fill="#262626" stroke="#7fada0" stroke-width="2.5" />
  <text x="480" y="311" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#7fada0">session</text>
  <text x="480" y="325" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">token</text>

  <!-- expected cloud service -->
  <circle cx="660" cy="230" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="660" y="235" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">mailbox</text>

  <!-- unfamiliar second session -->
  <circle cx="660" cy="420" r="26" fill="#1c1c1c" stroke="#c07a7a" stroke-width="2.5" stroke-dasharray="3 4" />
  <text x="660" y="416" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#c07a7a">unfamiliar</text>
  <text x="660" y="428" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#c07a7a">session</text>

  <!-- eyebrow -->
  <text x="600" y="540" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">A VALID LOGIN IS NOT A VERDICT</text>
</svg>
