<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">OSINT corroboration: evidence converging on a verified identity</title>
  <desc id="desc">Abstract illustration of several evidence nodes, representing a profile, location, username, photograph and document, converging on a central identity node. Two candidate nodes sit apart with broken connecting lines, representing evidence that failed to corroborate.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- broken connections from the two nodes that fail to corroborate, drawn first -->
  <g stroke="#444444" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6">
    <line x1="340" y1="460" x2="470" y2="405" />
    <line x1="860" y1="460" x2="730" y2="405" />
  </g>

  <!-- solid connections from the four corroborating nodes -->
  <g stroke="#444444" stroke-width="1.5" opacity="0.85">
    <line x1="600" y1="315" x2="600" y2="100" />
    <line x1="600" y1="315" x2="850" y2="185" />
    <line x1="600" y1="315" x2="600" y2="535" />
    <line x1="600" y1="315" x2="350" y2="185" />
  </g>

  <!-- corroborating node: location (top) -->
  <circle cx="600" cy="90" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <circle cx="600" cy="86" r="6" fill="#7fada0" />
  <circle cx="600" cy="86" r="10" fill="none" stroke="#7fada0" stroke-width="1.5" opacity="0.6" />

  <!-- corroborating node: conversation/relationship (upper right) -->
  <circle cx="860" cy="180" r="26" fill="#1c1c1c" stroke="#c07a7a" stroke-width="2" />
  <line x1="850" y1="176" x2="870" y2="176" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="850" y1="185" x2="864" y2="185" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />

  <!-- corroborating node: document (bottom) -->
  <circle cx="600" cy="540" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <rect x="590" y="528" width="20" height="24" rx="2" fill="none" stroke="#7fada0" stroke-width="2" />
  <line x1="594" y1="536" x2="606" y2="536" stroke="#7fada0" stroke-width="1.5" />
  <line x1="594" y1="542" x2="606" y2="542" stroke="#7fada0" stroke-width="1.5" />

  <!-- corroborating node: photograph (upper left) -->
  <circle cx="340" cy="180" r="26" fill="#1c1c1c" stroke="#b4a26a" stroke-width="2" />
  <rect x="329" y="170" width="22" height="20" rx="3" fill="none" stroke="#b4a26a" stroke-width="2" />

  <!-- non-corroborating candidate node: username (lower left), dashed ring -->
  <circle cx="340" cy="460" r="26" fill="#1c1c1c" stroke="#666666" stroke-width="2" stroke-dasharray="3 4" />
  <circle cx="340" cy="460" r="10" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="2 3" />

  <!-- non-corroborating candidate node: organisation (lower right), dashed ring -->
  <circle cx="860" cy="460" r="26" fill="#1c1c1c" stroke="#666666" stroke-width="2" stroke-dasharray="3 4" />
  <rect x="850" y="450" width="20" height="18" rx="2" fill="none" stroke="#666666" stroke-width="2" stroke-dasharray="2 3" />

  <!-- central verified identity node -->
  <circle cx="600" cy="315" r="62" fill="none" stroke="#7fada0" stroke-width="1.5" opacity="0.5" />
  <circle cx="600" cy="315" r="54" fill="#262626" stroke="#7fada0" stroke-width="2.5" />
  <circle cx="600" cy="298" r="16" fill="#d7dce1" />
  <rect x="572" y="328" width="56" height="34" rx="17" fill="#d7dce1" />
</svg>
