<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">One security problem, viewed through four connected lenses</title>
  <desc id="desc">A terminal-style illustration of a central problem node connected by thin lines to four surrounding nodes labelled CIS, NIST, ISO and NZISM, each representing a different lens on the same underlying security problem.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">compare.log</text>

  <!-- spokes -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="600" y1="300" x2="600" y2="160" />
    <line x1="600" y1="300" x2="760" y2="230" />
    <line x1="600" y1="300" x2="760" y2="380" />
    <line x1="600" y1="300" x2="440" y2="380" />
    <line x1="600" y1="300" x2="440" y2="230" />
  </g>

  <!-- central problem node -->
  <circle cx="600" cy="300" r="34" fill="#262626" stroke="#b4a26a" stroke-width="2.5" />
  <text x="600" y="296" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#b4a26a">security</text>
  <text x="600" y="308" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#b4a26a">problem</text>

  <!-- top node placeholder (unused fifth spoke visual balance) -->
  <circle cx="600" cy="160" r="18" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" stroke-dasharray="2 3" />

  <!-- four framework nodes -->
  <circle cx="760" cy="230" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="760" y="234" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">CIS</text>

  <circle cx="760" cy="380" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="760" y="384" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">NIST</text>

  <circle cx="440" cy="380" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="440" y="384" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">ISO</text>

  <circle cx="440" cy="230" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="440" y="234" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">NZISM</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">SAME PROBLEM. FOUR LENSES.</text>
</svg>
