<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">SPF, DKIM and DMARC email authentication results</title>
  <desc id="desc">A terminal-style illustration of an email Authentication-Results header, showing spf=pass and dkim=pass for an attacker-controlled domain while dmarc=fail flags the mismatch against the spoofed sender domain.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="300" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">message-source.eml</text>

  <!-- header block -->
  <text x="140" y="150" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#8f8f8f">Authentication-Results:</text>

  <text x="170" y="210" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="26" font-weight="600">
    <tspan fill="#7fada0">spf=pass</tspan>
    <tspan fill="#666666"> smtp.mailfrom=mailer.attacker.net</tspan>
  </text>

  <text x="170" y="260" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="26" font-weight="600">
    <tspan fill="#7fada0">dkim=pass</tspan>
    <tspan fill="#666666"> header.d=mailer.attacker.net</tspan>
  </text>

  <text x="170" y="310" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="26" font-weight="600">
    <tspan fill="#c07a7a">dmarc=fail</tspan>
    <tspan fill="#8f8f8f"> header.from=microsoft.com</tspan>
  </text>

  <!-- divider -->
  <line x1="140" y1="360" x2="1060" y2="360" stroke="#444444" stroke-width="1" />

  <!-- from header, visible sender -->
  <text x="140" y="410" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#8f8f8f">From: <tspan fill="#d7dce1" font-weight="600">"Microsoft Support" &lt;support@microsoft.com&gt;</tspan></text>

  <!-- flag on the mismatch -->
  <g>
    <circle cx="1010" cy="303" r="16" fill="none" stroke="#c07a7a" stroke-width="2.5" />
    <line x1="1004" y1="297" x2="1016" y2="309" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1016" y1="297" x2="1004" y2="309" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- eyebrow -->
  <text x="600" y="480" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">SPF · DKIM · DMARC</text>
</svg>
