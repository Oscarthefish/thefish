<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Event ID 4688, a process creation event</title>
  <desc id="desc">A terminal-style illustration of an Event Viewer entry for Event ID 4688, a process creation event, showing the creator process, new process and account fields feeding into a short investigation timeline.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="260" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">security.evtx</text>

  <!-- event id -->
  <text x="140" y="140" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#8f8f8f">Event ID</text>
  <text x="140" y="185" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="46" font-weight="700" fill="#d7dce1">4688</text>
  <text x="330" y="185" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#7fada0">A new process has been created</text>

  <line x1="140" y1="215" x2="1060" y2="215" stroke="#444444" stroke-width="1" />

  <!-- fields -->
  <text x="140" y="260" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <tspan fill="#8f8f8f">Creator Process: </tspan><tspan fill="#d7dce1" font-weight="600">winword.exe</tspan>
  </text>
  <text x="140" y="300" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <tspan fill="#8f8f8f">New Process:    </tspan><tspan fill="#b4a26a" font-weight="600">powershell.exe</tspan>
  </text>
  <text x="140" y="340" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="22">
    <tspan fill="#8f8f8f">Account:        </tspan><tspan fill="#d7dce1" font-weight="600">jsmith</tspan>
  </text>

  <!-- flag on the parent/child relationship -->
  <g>
    <circle cx="1010" cy="253" r="16" fill="none" stroke="#c07a7a" stroke-width="2.5" />
    <line x1="1004" y1="247" x2="1016" y2="259" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="1016" y1="247" x2="1004" y2="259" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- short timeline strip -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="140" y1="430" x2="1060" y2="430" />
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8f8f8f" text-anchor="middle">
    <circle cx="220" cy="430" r="5" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
    <text x="220" y="455">logon</text>

    <circle cx="460" cy="430" r="5" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
    <text x="460" y="455">winword.exe</text>

    <circle cx="700" cy="430" r="6" fill="#262626" stroke="#c07a7a" stroke-width="2.5" />
    <text x="700" y="455" fill="#c07a7a">4688</text>

    <circle cx="940" cy="430" r="5" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
    <text x="940" y="455">dns query</text>
  </g>

  <!-- eyebrow -->
  <text x="600" y="540" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">WHAT AN EVENT ID ACTUALLY PROVES</text>
</svg>
