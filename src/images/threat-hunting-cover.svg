<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">One hypothesis, followed outward to a timeline</title>
  <desc id="desc">A terminal-style illustration of a hypothesis node branching into process, host and network nodes, which connect through a user node to a domain node and converge on a timeline.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="200" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">hunt.log</text>

  <!-- connecting lines -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="600" y1="150" x2="600" y2="230" />
    <line x1="600" y1="230" x2="480" y2="310" />
    <line x1="600" y1="230" x2="720" y2="310" />
    <line x1="480" y1="310" x2="440" y2="400" />
    <line x1="720" y1="310" x2="760" y2="400" />
    <line x1="440" y1="400" x2="600" y2="470" />
    <line x1="760" y1="400" x2="600" y2="470" />
  </g>

  <!-- hypothesis node, top -->
  <circle cx="600" cy="120" r="30" fill="#262626" stroke="#7fada0" stroke-width="2.5" />
  <text x="600" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7fada0">hypo-</text>
  <text x="600" y="127" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7fada0">thesis</text>

  <!-- process node -->
  <circle cx="600" cy="230" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="600" y="235" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">process</text>

  <!-- host and network -->
  <circle cx="480" cy="310" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="480" y="315" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">host</text>

  <circle cx="720" cy="310" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="720" y="315" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">network</text>

  <!-- user and domain -->
  <circle cx="440" cy="400" r="18" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <text x="440" y="405" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">user</text>

  <circle cx="760" cy="400" r="18" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <text x="760" y="405" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">domain</text>

  <!-- timeline convergence -->
  <circle cx="600" cy="480" r="10" fill="#262626" stroke="#7fada0" stroke-width="2" />
  <line x1="460" y1="480" x2="740" y2="480" stroke="#444444" stroke-width="1.5" />
  <circle cx="510" cy="480" r="3" fill="#666666" />
  <circle cx="690" cy="480" r="3" fill="#666666" />
  <text x="600" y="508" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">timeline</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">START WITH A QUESTION</text>
</svg>
