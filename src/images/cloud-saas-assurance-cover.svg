<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A responsibility stack from customer through SaaS provider to cloud provider</title>
  <desc id="desc">A terminal-style illustration of three stacked layers, customer, SaaS provider and cloud provider, connected vertically to show responsibility distributed across layers rather than owned by any one party alone.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">cloud.log</text>

  <!-- vertical connector -->
  <line x1="600" y1="175" x2="600" y2="440" stroke="#444444" stroke-width="1.5" />

  <!-- customer layer -->
  <circle cx="600" cy="150" r="26" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="600" y="154" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7.5" fill="#b4a26a">customer</text>
  <text x="700" y="154" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">users · roles · tenant config · data use</text>

  <!-- saas provider layer -->
  <circle cx="600" cy="300" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="600" y="298" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#7fada0">saas</text>
  <text x="600" y="308" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#7fada0">provider</text>
  <text x="700" y="304" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">application · support · platform config</text>

  <!-- cloud provider layer -->
  <circle cx="600" cy="450" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="600" y="448" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">cloud</text>
  <text x="600" y="458" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">provider</text>
  <text x="700" y="454" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">compute · physical infrastructure</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">IT REDISTRIBUTES RESPONSIBILITY</text>
</svg>
