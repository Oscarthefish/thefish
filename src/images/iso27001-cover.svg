<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A continual cycle of six management-system stages</title>
  <desc id="desc">A terminal-style illustration of six nodes, Context, Risk, Controls, Evidence, Review and Improve, arranged in a ring with connecting arrows forming a continuous loop.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="200" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">isms.log</text>

  <!-- ring connections -->
  <g stroke="#444444" stroke-width="1.5" fill="none">
    <path d="M 600 178 A 140 140 0 0 1 721 230" />
    <path d="M 721 230 A 140 140 0 0 1 721 370" />
    <path d="M 721 370 A 140 140 0 0 1 600 422" />
    <path d="M 600 422 A 140 140 0 0 1 479 370" />
    <path d="M 479 370 A 140 140 0 0 1 479 230" />
    <path d="M 479 230 A 140 140 0 0 1 600 178" />
  </g>

  <!-- six nodes -->
  <circle cx="600" cy="160" r="22" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="600" y="164" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#b4a26a">context</text>

  <circle cx="721" cy="230" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="721" y="234" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8f8f8f">risk</text>

  <circle cx="721" cy="370" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="721" y="374" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">controls</text>

  <circle cx="600" cy="440" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="600" y="444" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">evidence</text>

  <circle cx="479" cy="370" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="479" y="374" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">review</text>

  <circle cx="479" cy="230" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="479" y="234" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">improve</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">CHECK THE SCOPE FIRST</text>
</svg>
