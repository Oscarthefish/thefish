<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Eighteen controls, three of them highlighted as foundational</title>
  <desc id="desc">A terminal-style illustration of an eighteen-node grid representing the CIS Critical Security Controls, with a smaller highlighted subset connecting down to a single alert node.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">controls.log</text>

  <!-- 18-node grid, 6 columns x 3 rows -->
  <g id="grid">
    <!-- row 1 -->
    <circle cx="330" cy="150" r="16" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
    <circle cx="410" cy="150" r="16" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
    <circle cx="490" cy="150" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="570" cy="150" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="650" cy="150" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="730" cy="150" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <!-- row 2 -->
    <circle cx="330" cy="220" r="16" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
    <circle cx="410" cy="220" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="490" cy="220" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="570" cy="220" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="650" cy="220" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="730" cy="220" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <!-- row 3 -->
    <circle cx="330" cy="290" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="410" cy="290" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="490" cy="290" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="570" cy="290" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="650" cy="290" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
    <circle cx="730" cy="290" r="16" fill="#1c1c1c" stroke="#444444" stroke-width="1.6" />
  </g>

  <text x="530" y="115" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8f8f8f">18 controls</text>

  <!-- connecting lines from the three highlighted nodes down to a single alert node -->
  <g stroke="#7fada0" stroke-width="1.4" opacity="0.7">
    <line x1="330" y1="166" x2="480" y2="420" />
    <line x1="410" y1="166" x2="480" y2="420" />
    <line x1="330" y1="236" x2="480" y2="420" />
  </g>

  <!-- alert node -->
  <circle cx="480" cy="440" r="26" fill="#262626" stroke="#b4a26a" stroke-width="2.5" />
  <text x="480" y="445" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#b4a26a">alert</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">WHY WAS THIS POSSIBLE?</text>
</svg>
