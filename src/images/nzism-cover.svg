<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A requirement branching into a compliant path and a risk-treatment path</title>
  <desc id="desc">A terminal-style illustration of a requirement node leading to an applicability check, a control and evidence node, then branching into a compliant path and a gap-risk-treatment-decision path.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">nzism.log</text>

  <!-- connecting lines -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="220" y1="300" x2="360" y2="300" />
    <line x1="360" y1="300" x2="500" y2="300" />
    <line x1="500" y1="300" x2="640" y2="300" />
    <line x1="640" y1="300" x2="760" y2="220" />
    <line x1="640" y1="300" x2="760" y2="380" />
    <line x1="760" y1="380" x2="880" y2="380" />
    <line x1="880" y1="380" x2="990" y2="380" />
  </g>

  <!-- requirement, applicability, control, evidence nodes -->
  <circle cx="220" cy="300" r="26" fill="#262626" stroke="#7fada0" stroke-width="2.2" />
  <text x="220" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#7fada0">require-</text>
  <text x="220" y="313" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#7fada0">ment</text>

  <circle cx="360" cy="300" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="360" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">applies?</text>

  <circle cx="500" cy="300" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="500" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">control</text>

  <circle cx="640" cy="300" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="640" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">evidence</text>

  <!-- compliant branch -->
  <circle cx="760" cy="220" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="760" y="224" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">compliant</text>

  <!-- gap/risk branch -->
  <circle cx="760" cy="380" r="18" fill="#1c1c1c" stroke="#c07a7a" stroke-width="1.8" />
  <text x="760" y="384" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">gap</text>

  <circle cx="880" cy="380" r="18" fill="#1c1c1c" stroke="#b4a26a" stroke-width="1.8" />
  <text x="880" y="384" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">risk</text>

  <circle cx="990" cy="380" r="20" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="990" y="378" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">decis-</text>
  <text x="990" y="387" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">ion</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">SEARCH IT, DON'T MEMORISE IT</text>
</svg>
