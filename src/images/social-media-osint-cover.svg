<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Social Media OSINT: from one profile to a digital footprint</title>
  <desc id="desc">Abstract illustration of a central identity node connected to a network of smaller profile, location, conversation and organisation nodes, representing a digital footprint expanding outward from one known social media profile.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- secondary connections between satellite nodes, drawn first so they sit behind everything -->
  <g stroke="#444444" stroke-width="1" stroke-dasharray="3 5" opacity="0.5">
    <line x1="860" y1="180" x2="860" y2="460" />
    <line x1="340" y1="180" x2="340" y2="460" />
  </g>

  <!-- primary connections from the central node to each satellite -->
  <g stroke="#444444" stroke-width="1.5" opacity="0.8">
    <line x1="600" y1="315" x2="600" y2="100" />
    <line x1="600" y1="315" x2="850" y2="185" />
    <line x1="600" y1="315" x2="850" y2="450" />
    <line x1="600" y1="315" x2="600" y2="535" />
    <line x1="600" y1="315" x2="350" y2="450" />
    <line x1="600" y1="315" x2="350" y2="185" />
  </g>

  <!-- satellite node: location (top) -->
  <circle cx="600" cy="90" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <circle cx="600" cy="86" r="6" fill="#7fada0" />
  <circle cx="600" cy="86" r="10" fill="none" stroke="#7fada0" stroke-width="1.5" opacity="0.6" />

  <!-- satellite node: conversation (upper right) -->
  <circle cx="860" cy="180" r="26" fill="#1c1c1c" stroke="#c07a7a" stroke-width="2" />
  <line x1="850" y1="176" x2="870" y2="176" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />
  <line x1="850" y1="185" x2="864" y2="185" stroke="#c07a7a" stroke-width="2.5" stroke-linecap="round" />

  <!-- satellite node: organisation (lower right) -->
  <circle cx="860" cy="460" r="26" fill="#1c1c1c" stroke="#b4a26a" stroke-width="2" />
  <rect x="850" y="450" width="20" height="18" rx="2" fill="none" stroke="#b4a26a" stroke-width="2" />

  <!-- satellite node: relationship (bottom) -->
  <circle cx="600" cy="540" r="26" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <circle cx="594" cy="538" r="9" fill="none" stroke="#7fada0" stroke-width="2" />
  <circle cx="608" cy="538" r="9" fill="none" stroke="#7fada0" stroke-width="2" />

  <!-- satellite node: username (lower left) -->
  <circle cx="340" cy="460" r="26" fill="#1c1c1c" stroke="#c07a7a" stroke-width="2" />
  <circle cx="340" cy="460" r="10" fill="none" stroke="#c07a7a" stroke-width="2" />

  <!-- satellite node: photograph (upper left) -->
  <circle cx="340" cy="180" r="26" fill="#1c1c1c" stroke="#b4a26a" stroke-width="2" />
  <rect x="329" y="170" width="22" height="20" rx="3" fill="none" stroke="#b4a26a" stroke-width="2" />

  <!-- central identity node -->
  <circle cx="600" cy="315" r="58" fill="#262626" stroke="#7fada0" stroke-width="2.5" />
  <circle cx="600" cy="298" r="16" fill="#d7dce1" />
  <rect x="572" y="328" width="56" height="34" rx="17" fill="#d7dce1" />
</svg>
