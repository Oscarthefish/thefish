<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">An alert branching into evidence, converging on a decision</title>
  <desc id="desc">A terminal-style illustration of a single alert node branching into endpoint, identity and network evidence nodes, which converge back into a single decision node, representing investigative reasoning.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">investigation.log</text>

  <!-- timeline ticks, faint, beneath the diagram -->
  <g stroke="#333333" stroke-width="1">
    <line x1="140" y1="560" x2="1060" y2="560" />
  </g>
  <g fill="#333333">
    <circle cx="220" cy="560" r="3" />
    <circle cx="380" cy="560" r="3" />
    <circle cx="540" cy="560" r="3" />
    <circle cx="700" cy="560" r="3" />
    <circle cx="860" cy="560" r="3" />
    <circle cx="1020" cy="560" r="3" />
  </g>

  <!-- connecting lines: alert -> three evidence nodes -> decision -->
  <g stroke="#444444" stroke-width="1.5" opacity="0.9">
    <line x1="270" y1="315" x2="460" y2="180" />
    <line x1="270" y1="315" x2="460" y2="315" />
    <line x1="270" y1="315" x2="460" y2="450" />
    <line x1="600" y1="180" x2="790" y2="315" />
    <line x1="600" y1="315" x2="790" y2="315" />
    <line x1="600" y1="450" x2="790" y2="315" />
  </g>

  <!-- alert node -->
  <circle cx="230" cy="315" r="38" fill="#262626" stroke="#c07a7a" stroke-width="2.5" />
  <text x="230" y="309" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#c07a7a">ALERT</text>
  <text x="230" y="328" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">4688</text>

  <!-- endpoint node -->
  <circle cx="530" cy="180" r="30" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="530" y="185" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7fada0">endpoint</text>

  <!-- identity node -->
  <circle cx="530" cy="315" r="30" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="530" y="320" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7fada0">identity</text>

  <!-- network node -->
  <circle cx="530" cy="450" r="30" fill="#1c1c1c" stroke="#7fada0" stroke-width="2" />
  <text x="530" y="455" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7fada0">network</text>

  <!-- decision node -->
  <circle cx="880" cy="315" r="44" fill="#2c3a37" stroke="#7fada0" stroke-width="2.5" />
  <text x="880" y="310" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1" fill="#7fada0">DECISION</text>
  <text x="880" y="329" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#8f8f8f">contain / escalate / close</text>

  <!-- eyebrow -->
  <text x="600" y="510" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">SHOW YOUR WORKING</text>
</svg>
