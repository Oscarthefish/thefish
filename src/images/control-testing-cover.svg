<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">One control branching into design, implementation and operation</title>
  <desc id="desc">A terminal-style illustration of a control node branching into three nodes labelled design, implementation and operation, each connecting to an evidence node and then a conclusion node.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">test.log</text>

  <!-- lines -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="220" y1="300" x2="380" y2="180" />
    <line x1="220" y1="300" x2="380" y2="300" />
    <line x1="220" y1="300" x2="380" y2="420" />
    <line x1="380" y1="180" x2="600" y2="300" />
    <line x1="380" y1="300" x2="600" y2="300" />
    <line x1="380" y1="420" x2="600" y2="300" />
    <line x1="600" y1="300" x2="780" y2="300" />
    <line x1="780" y1="300" x2="960" y2="300" />
  </g>

  <!-- control node -->
  <circle cx="220" cy="300" r="26" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="220" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#b4a26a">control</text>

  <!-- design/implementation/operation -->
  <circle cx="380" cy="180" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="380" y="184" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">design</text>

  <circle cx="380" cy="300" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="380" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6.5" fill="#8f8f8f">implement</text>

  <circle cx="380" cy="420" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="380" y="424" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">operate</text>

  <!-- evidence node -->
  <circle cx="600" cy="300" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="600" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">evidence</text>

  <!-- conclusion node -->
  <circle cx="780" cy="300" r="20" fill="#1c1c1c" stroke="#c07a7a" stroke-width="1.8" />
  <text x="780" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">finding</text>

  <circle cx="960" cy="300" r="22" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="960" y="298" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">conclu-</text>
  <text x="960" y="307" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">sion</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">PRESENT IS NOT EFFECTIVE</text>
</svg>
