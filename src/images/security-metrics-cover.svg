<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Raw data moving through context and trend toward a decision</title>
  <desc id="desc">A terminal-style illustration of a chain of nodes: raw data, metric, context, trend, risk, and action, representing how a measurement should lead to a decision.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">metrics.log</text>

  <!-- chain -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="120" y1="300" x2="255" y2="300" />
    <line x1="255" y1="300" x2="390" y2="300" />
    <line x1="390" y1="300" x2="525" y2="300" />
    <line x1="525" y1="300" x2="660" y2="300" />
    <line x1="660" y1="300" x2="800" y2="300" />
    <line x1="800" y1="300" x2="960" y2="300" />
  </g>

  <circle cx="120" cy="300" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="120" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="6.5" fill="#8f8f8f">raw data</text>

  <circle cx="255" cy="300" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="255" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">metric</text>

  <circle cx="390" cy="300" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="390" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">context</text>

  <circle cx="525" cy="300" r="18" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="525" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">trend</text>

  <circle cx="660" cy="300" r="18" fill="#1c1c1c" stroke="#c07a7a" stroke-width="1.6" />
  <text x="660" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">risk</text>

  <circle cx="960" cy="300" r="24" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="960" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">action</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">COUNT IS NOT RISK</text>
</svg>
