<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Govern at the centre, five functions arranged around it</title>
  <desc id="desc">A terminal-style illustration of a central Govern node connected by thin lines to five surrounding nodes representing Identify, Protect, Detect, Respond and Recover, arranged in a loose circle.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="200" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">csf.core</text>

  <!-- spokes from centre to each function -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="600" y1="300" x2="600" y2="180" />
    <line x1="600" y1="300" x2="720" y2="262" />
    <line x1="600" y1="300" x2="678" y2="390" />
    <line x1="600" y1="300" x2="522" y2="390" />
    <line x1="600" y1="300" x2="480" y2="262" />
  </g>

  <!-- Govern, centre -->
  <circle cx="600" cy="300" r="34" fill="#262626" stroke="#b4a26a" stroke-width="2.5" />
  <text x="600" y="305" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#b4a26a">GOVERN</text>

  <!-- five surrounding functions -->
  <circle cx="600" cy="180" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="600" y="184" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">identify</text>

  <circle cx="720" cy="262" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="720" y="266" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">protect</text>

  <circle cx="678" cy="390" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="678" y="394" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">detect</text>

  <circle cx="522" cy="390" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="522" y="394" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">respond</text>

  <circle cx="480" cy="262" r="20" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="480" y="266" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">recover</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">SIX FUNCTIONS, NOT SIX STEPS</text>
</svg>
