<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">A claim converging with several evidence sources into a finding</title>
  <desc id="desc">A terminal-style illustration of a claim node and several evidence-source nodes converging into a validation node, then branching into a finding node and a risk and treatment node.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">assurance.log</text>

  <!-- lines: claim + evidence sources into validation -->
  <g stroke="#444444" stroke-width="1.5">
    <line x1="200" y1="200" x2="430" y2="300" />
    <line x1="200" y1="300" x2="430" y2="300" />
    <line x1="200" y1="400" x2="430" y2="300" />
    <line x1="430" y1="300" x2="600" y2="300" />
    <line x1="600" y1="300" x2="770" y2="230" />
    <line x1="600" y1="300" x2="770" y2="370" />
  </g>

  <!-- claim and evidence source nodes -->
  <circle cx="200" cy="200" r="20" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="200" y="204" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#b4a26a">claim</text>

  <circle cx="200" cy="300" r="16" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="200" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">config</text>

  <circle cx="200" cy="400" r="16" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.6" />
  <text x="200" y="404" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">logs</text>

  <!-- validation node -->
  <circle cx="430" cy="300" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="430" y="296" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">valid-</text>
  <text x="430" y="306" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#8f8f8f">ation</text>

  <!-- assessment node -->
  <circle cx="600" cy="300" r="22" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="600" y="304" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">finding</text>

  <!-- risk and treatment -->
  <circle cx="770" cy="230" r="18" fill="#1c1c1c" stroke="#c07a7a" stroke-width="1.8" />
  <text x="770" y="234" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">risk</text>

  <circle cx="770" cy="370" r="20" fill="#262626" stroke="#b4a26a" stroke-width="2.2" />
  <text x="770" y="368" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">treat-</text>
  <text x="770" y="378" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">ment</text>

  <!-- eyebrow -->
  <text x="600" y="560" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">A CLAIM IS NOT EVIDENCE</text>
</svg>
