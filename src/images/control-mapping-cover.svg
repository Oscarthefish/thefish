<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Four framework nodes mapping onto a smaller set of internal controls</title>
  <desc id="desc">A terminal-style illustration of four framework nodes, CIS, NIST, ISO and NZISM, connected by crossing lines to two internal control nodes below them, which converge into a single evidence node at the base.</desc>

  <rect x="0" y="0" width="1200" height="630" fill="#1c1c1c" />

  <!-- chrome bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#1c1c1c" />
  <rect x="0" y="63" width="1200" height="1" fill="#444444" />
  <circle cx="40" cy="32" r="8" fill="#c07a7a" />
  <circle cx="66" cy="32" r="8" fill="#b4a26a" />
  <circle cx="92" cy="32" r="8" fill="#7fada0" />
  <rect x="140" y="16" width="220" height="30" rx="15" fill="#262626" stroke="#444444" stroke-width="1" />
  <text x="162" y="36" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8f8f8f">mapping.log</text>

  <!-- crossing connector lines: 4 top nodes to 2 middle nodes -->
  <line x1="330" y1="150" x2="480" y2="290" stroke="#444444" stroke-width="1.3" />
  <line x1="330" y1="150" x2="720" y2="290" stroke="#444444" stroke-width="1.1" />
  <line x1="530" y1="150" x2="480" y2="290" stroke="#444444" stroke-width="1.3" />
  <line x1="530" y1="150" x2="720" y2="290" stroke="#444444" stroke-width="1.1" />
  <line x1="670" y1="150" x2="480" y2="290" stroke="#444444" stroke-width="1.1" />
  <line x1="670" y1="150" x2="720" y2="290" stroke="#444444" stroke-width="1.3" />
  <line x1="870" y1="150" x2="480" y2="290" stroke="#444444" stroke-width="1.1" />
  <line x1="870" y1="150" x2="720" y2="290" stroke="#444444" stroke-width="1.3" />

  <!-- middle nodes to evidence node -->
  <line x1="480" y1="290" x2="600" y2="420" stroke="#444444" stroke-width="1.5" />
  <line x1="720" y1="290" x2="600" y2="420" stroke="#444444" stroke-width="1.5" />

  <!-- top: four framework nodes -->
  <circle cx="330" cy="150" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="330" y="154" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">CIS</text>

  <circle cx="530" cy="150" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="530" y="154" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">NIST</text>

  <circle cx="670" cy="150" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="670" y="154" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">ISO</text>

  <circle cx="870" cy="150" r="24" fill="#1c1c1c" stroke="#7fada0" stroke-width="1.8" />
  <text x="870" y="154" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#8f8f8f">NZISM</text>

  <!-- middle: two internal control nodes -->
  <circle cx="480" cy="290" r="26" fill="#262626" stroke="#b4a26a" stroke-width="2" />
  <text x="480" y="288" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">internal</text>
  <text x="480" y="296" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">control</text>

  <circle cx="720" cy="290" r="26" fill="#262626" stroke="#b4a26a" stroke-width="2" />
  <text x="720" y="288" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">internal</text>
  <text x="720" y="296" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="7" fill="#b4a26a">control</text>

  <!-- base: evidence node -->
  <circle cx="600" cy="420" r="28" fill="#262626" stroke="#c07a7a" stroke-width="2.2" />
  <text x="600" y="424" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="8" fill="#c07a7a">evidence</text>

  <!-- eyebrow -->
  <text x="600" y="530" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="4" fill="#7fada0">RELATED IS NOT IDENTICAL</text>
</svg>
